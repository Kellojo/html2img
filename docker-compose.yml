services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_PATH: /data/html2img.db
      APP_SECRET: 'change-me-to-a-long-random-string'
      # Uncomment (or set in an .env file next to this compose file) to customize:
      # ENABLE_SIGNUP: 'true'
      # ENABLE_PASSWORD_LOGIN: 'true'
      # ORIGIN: 'https://html2img.example.com'
      # OIDC_ONLY: 'false'
      # OIDC_ISSUER: 'https://auth.example.com'
      # OIDC_CLIENT_ID: 'html2img'
      # OIDC_CLIENT_SECRET: 'change-me'
      # OIDC_SCOPES: 'openid profile email'
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
